    <main>
        <header></header>

        <section class="contacto">
            <h1 class="titulo-contacto text-secondary">Contactanos</h1>
            <form class="form-contacto" action="https://formspree.io/f/xdegkdva" method="post">
                <div class="grupo-input">
                    <label> Nombre:
                        <input type="text"
                        name="nombre"
                        required>
                    </label>
                </div>

                <div class="grupo-input">
                    <label>Email:
                        <input type="email"
                        name="email"
                        required>
                    </label>
                </div>

                <div class="grupo-input">
                    <label for="mensaje">Su mensaje</label>
                    <textarea id="mensaje" name="mensaje" required></textarea>
                </div>
    
                <button class="btn bg-secondary text-dark" typen="submit">Enviar</button>
            </form>
        </section>

    </main>
